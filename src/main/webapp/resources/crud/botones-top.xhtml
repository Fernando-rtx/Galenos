<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="jakarta.faces.composite"
      xmlns:p="primefaces">

    <!--
    Componente compuesto reutilizable para iniciar o cancelar una edición.
    La vista entrega un modelo con nuevo()/cancelar(), los IDs que se deben
    actualizar por AJAX y el JavaScript opcional que abre/cierra su diálogo.
    -->

    <cc:interface>
        <cc:attribute name="resetNuevo"
                      required="false"
                      default="false"
                      type="java.lang.Boolean" />
        <cc:attribute name="model"
                      required="true" />
        <cc:attribute name="actualizar"
                      required="false"
                      default="@form" />
        <cc:attribute name="oncompleteNuevo"
                      required="false"
                      default="" />
        <cc:attribute name="oncompleteCancelar"
                      required="false"
                      default="" />
    </cc:interface>

    <cc:implementation>
        <!-- process="@this" envía solo el botón; update vuelve a renderizar tabla y diálogo. -->
        <div class="crud-actions-top">
            <p:commandButton
                value="#{msg['crud.nuevo']}"
                icon="pi pi-plus"
                action="#{cc.attrs.model.nuevo}"
                process="@this"
                update="#{cc.attrs.actualizar}"
                resetValues="#{cc.attrs.resetNuevo}"
                rendered="#{cc.attrs.model.estado eq 'LISTADO'}"
                oncomplete="#{cc.attrs.oncompleteNuevo}"
                styleClass="clinical-primary" />

            <p:commandButton
                value="#{msg['crud.cancelar']}"
                icon="pi pi-times"
                action="#{cc.attrs.model.cancelar}"
                process="@this"
                update="#{cc.attrs.actualizar}"
                immediate="true"
                rendered="#{cc.attrs.model.estado ne 'LISTADO'}"
                oncomplete="#{cc.attrs.oncompleteCancelar}"
                styleClass="cancel-button" />
        </div>
    </cc:implementation>
</html>
