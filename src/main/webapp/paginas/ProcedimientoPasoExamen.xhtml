<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:crud="jakarta.faces.composite/crud"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:p="primefaces"
    xmlns:ui="jakarta.faces.facelets"
    template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="titulo">
        #{msg['ppe.titulo']} | #{msg['app.nombre']}
    </ui:define>

    <ui:define name="head">
        <h:outputStylesheet library="estilos" name="procedimiento-paso-examen.css"/>
    </ui:define>

    <ui:define name="contenido">
        <main class="page-shell">
            <section class="clinical-card">
                <div class="clinical-topbar"></div>
                <div class="card-content">
                    <div class="page-header">
                        <div class="header-info">
                            <div class="clinical-brand">
                                <span class="clinical-brand-icon">
                                    <i class="pi pi-verified"></i>
                                </span>
                                #{msg['app.nombre']} - #{msg['app.areaTrabajo']}
                            </div>
                            <h1 class="page-title">#{msg['ppe.titulo']}</h1>
                            <p class="page-subtitle">#{msg['ppe.subtitulo']}</p>
                        </div>
                        <crud:botones-top
                            model="#{procedimientoPasoExamenModel}"
                            actualizar="messages ppeTable edicionDialog"
                            oncompleteNuevo="PF('ppeDialog').show()" />
                    </div>

                    <div class="section-divider"></div>
                    <p:messages id="messages" showDetail="true" closable="true" />

                    <div class="table-section">
                        <div class="table-heading">
                            <div class="table-title">
                                <i class="pi pi-list"></i>
                                #{msg['ppe.lista']}
                            </div>
                        </div>

                        <p:dataTable id="ppeTable" value="#{procedimientoPasoExamenModel}" var="item"
                            lazy="true" paginator="true" rows="10" reflow="true"
                            selectionMode="single" selection="#{procedimientoPasoExamenModel.seleccionado}"
                            rowKey="#{procedimientoPasoExamenModel.getRowKey(item)}"
                            emptyMessage="#{msg['ppe.sinRegistros']}"
                            styleClass="ppe-table">

                            <p:ajax event="rowSelect" listener="#{procedimientoPasoExamenModel.seleccionar(item)}"
                                update="edicionDialog" oncomplete="PF('ppeDialog').show()" />

                            <p:column headerText="#{msg['ppe.examen']}" field="idExamen.nombre"
                                sortBy="#{item.idExamen.nombre}" filterBy="#{item.idExamen.nombre}"
                                filterMatchMode="contains" filterPlaceholder="#{msg['ppe.buscar']}">
                                <h:outputText value="#{item.idExamen.nombre}" />
                            </p:column>

                            <p:column headerText="#{msg['ppe.paso']}"
                                field="idProcedimientoPaso.nombre"
                                sortBy="#{item.idProcedimientoPaso.nombre}">
                                <h:outputText value="#{item.idProcedimientoPaso.nombre}" />
                            </p:column>

                            <p:column headerText="#{msg['ppe.fecha']}"
                                field="fechaCreacion" sortBy="#{item.fechaCreacion}">
                                <h:outputText value="#{item.fechaCreacion}">
                                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                                </h:outputText>
                            </p:column>

                            <p:column headerText="#{msg['ppe.activo']}">
                                <p:tag styleClass="clinical-status"
                                    value="#{item.activo eq true ? msg['ppe.activoLabel'] : msg['ppe.inactivo']}"
                                    severity="#{item.activo eq true ? 'success' : 'secondary'}" />
                            </p:column>

                            <p:column headerText="#{msg['ppe.observaciones']}" styleClass="observaciones-cell">
                                <h:outputText value="#{empty item.observaciones ? msg['ppe.sinObservaciones'] : item.observaciones}"
                                    styleClass="#{empty item.observaciones ? 'empty-note' : ''}" />
                            </p:column>

                        </p:dataTable>
                    </div>
                </div>
            </section>
        </main>

        <p:dialog id="edicionDialog" widgetVar="ppeDialog"
            header="#{procedimientoPasoExamenModel.estado eq 'CREACION' ? msg['ppe.nuevo'] : msg['ppe.editar']}"
            modal="true" responsive="true" resizable="false" width="560"
            styleClass="clinical-dialog">

            <p:outputPanel id="edicionContenido" layout="block">
                <h:panelGroup rendered="#{procedimientoPasoExamenModel.seleccionado ne null}">
                    <div class="dialog-intro">
                        <div class="dialog-intro-icon"><i class="pi pi-file-edit"></i></div>
                        <div>
                            <strong>#{msg['ppe.informacion']}</strong>
                            <span>#{msg['ppe.completar']}</span>
                        </div>
                    </div>

                    <div class="dialog-form">
                        <div class="form-field">
                            <p:outputLabel for="idExamen" value="#{msg['ppe.examen']}" styleClass="form-label" />
                            <p:selectOneMenu id="idExamen"
                                value="#{procedimientoPasoExamenModel.seleccionado.idExamen}"
                                converter="#{examenConverter}"

                                required="true" requiredMessage="#{msg['mensajes.error']}"
                                styleClass="full-width">
                                <f:selectItem itemLabel="#{msg['ppe.seleccionarExamen']}" itemValue="#{null}" />
                                <f:selectItems value="#{procedimientoPasoExamenModel.examenes}" var="examen"
                                    itemLabel="#{examen.nombre}" itemValue="#{examen}" />
                            </p:selectOneMenu>
                        </div>

                        <div class="form-field">
                            <p:outputLabel for="idProcedimientoPaso" value="#{msg['ppe.paso']}" styleClass="form-label" />
                            <p:selectOneMenu id="idProcedimientoPaso"
                                value="#{procedimientoPasoExamenModel.seleccionado.idProcedimientoPaso}"
                                converter="#{procedimientoPasoConverter}"

                                required="true" requiredMessage="#{msg['mensajes.error']}"
                                styleClass="full-width">
                                <f:selectItem itemLabel="#{msg['ppe.seleccionarPaso']}" itemValue="#{null}" />
                                <f:selectItems value="#{procedimientoPasoExamenModel.procedimientosPaso}" var="paso"
                                    itemLabel="#{paso.nombre}" itemValue="#{paso}" />
                            </p:selectOneMenu>
                        </div>

                        <div class="form-field">
                            <p:outputLabel for="observaciones" value="#{msg['ppe.observaciones']}" styleClass="form-label" />
                            <p:inputTextarea id="observaciones"
                                value="#{procedimientoPasoExamenModel.seleccionado.observaciones}"
                                rows="5" autoResize="false"
                                placeholder="#{msg['ppe.observacionesPlaceholder']}" />
                        </div>

                        <div class="toggle-field">
                            <div class="toggle-info">
                                <strong>#{msg['ppe.activo']}</strong>
                                <span>#{msg['ppe.usarSistema']}</span>
                            </div>
                            <p:toggleSwitch id="activo" value="#{procedimientoPasoExamenModel.seleccionado.activo}" />
                        </div>
                    </div>

                    <div class="dialog-actions">
                        <p:commandButton value="#{msg['crud.quitar']}"
                            icon="pi pi-trash"
                            styleClass="ui-button-danger ui-button-outlined"
                            rendered="#{procedimientoPasoExamenModel.estado eq 'EDICION'}"
                            action="#{procedimientoPasoExamenModel.quitar(procedimientoPasoExamenModel.seleccionado)}"
                            process="@this" update="messages ppeTable edicionDialog"
                            resetValues="true"
                            oncomplete="if (!args.validationFailed) PF('ppeDialog').hide()">
                            <p:confirm header="#{msg['crud.confirmar']}"
                                message="#{msg['ppe.confirmarQuitar']}"
                                icon="pi pi-exclamation-triangle" />
                        </p:commandButton>
                        <crud:botones-bottom model="#{procedimientoPasoExamenModel}"
                            procesar="@this edicionContenido"
                            actualizar="messages ppeTable edicionDialog"
                            oncompleteCancelar="PF('ppeDialog').hide()"
                            oncompleteGuardar="if (!args.validationFailed) PF('ppeDialog').hide()" />
                    </div>
                </h:panelGroup>
            </p:outputPanel>
            <p:confirmDialog global="true" responsive="true">
                <p:commandButton value="#{msg['crud.no']}" type="button"
                    styleClass="ui-confirmdialog-no ui-button-flat" />
                <p:commandButton value="#{msg['crud.si']}" type="button"
                    styleClass="ui-confirmdialog-yes ui-button-danger" />
            </p:confirmDialog>
        </p:dialog>
    </ui:define>
</ui:composition>
