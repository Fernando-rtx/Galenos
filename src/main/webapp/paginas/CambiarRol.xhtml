<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:p="primefaces"
    xmlns:ui="jakarta.faces.facelets"
    template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="titulo">#{msg['cambiarRol.titulo']} | #{msg['app.nombre']}</ui:define>

    <ui:define name="head">
        <h:outputStylesheet library="estilos" name="cambiar-rol.css" />
    </ui:define>

    <ui:define name="contenido">
        <div class="cambiar-rol-page">
            <section class="cambiar-rol-card">
                <div class="cambiar-rol-topbar"></div>
                <div class="cambiar-rol-content">
                    <div class="cambiar-rol-heading">
                        <span class="cambiar-rol-icon"><i class="pi pi-user-edit" aria-hidden="true"></i></span>
                        <div>
                            <h1>#{msg['cambiarRol.titulo']}</h1>
                            <p>#{msg['cambiarRol.subtitulo']}</p>
                        </div>
                    </div>

                    <p:messages id="cambiarRolMessages" globalOnly="true" showDetail="false" closable="true" />

                    <div class="cambiar-rol-form">
                        <div class="cambiar-rol-field">
                            <p:outputLabel for="clinicaSeleccionada" value="#{msg['cambiarRol.clinica']}" />
                            <p:selectOneMenu id="clinicaSeleccionada"
                                             value="#{cambiarRolBean.clinicaSeleccionada}"
                                             required="true"
                                             requiredMessage="#{msg['cambiarRol.clinicaRequerida']}">
                                <f:selectItem itemLabel="#{msg['cambiarRol.seleccionarClinica']}"
                                              itemValue="" noSelectionOption="true" />
                                <f:selectItems value="#{cambiarRolBean.clinicas}" var="clinica"
                                               itemLabel="#{clinica.nombre}"
                                               itemValue="#{clinica.idClinica.toString()}" />
                                <p:ajax event="change" listener="#{cambiarRolBean.cambiarClinica}"
                                        process="@this" update="rolPanel personaPanel cambiarRolMessages" />
                            </p:selectOneMenu>
                            <p:message for="clinicaSeleccionada" showSummary="true" showDetail="false" />
                        </div>

                        <p:outputPanel id="rolPanel" layout="block" styleClass="cambiar-rol-field">
                            <p:outputLabel for="rolSeleccionado" value="#{msg['cambiarRol.rol']}" />
                            <p:selectOneMenu id="rolSeleccionado"
                                             value="#{cambiarRolBean.rolSeleccionado}"
                                             disabled="#{empty cambiarRolBean.clinicaSeleccionada}"
                                             required="true"
                                             requiredMessage="#{msg['cambiarRol.rolRequerido']}">
                                <f:selectItem itemLabel="#{msg['cambiarRol.seleccionarRol']}"
                                              itemValue="" noSelectionOption="true" />
                                <f:selectItems value="#{cambiarRolBean.rolesDisponibles}" var="rol"
                                               itemLabel="#{rol.nombre}" itemValue="#{rol.idRol.toString()}" />
                                <p:ajax event="change" listener="#{cambiarRolBean.cambiarRol}"
                                        process="@this" update="personaPanel cambiarRolMessages" />
                            </p:selectOneMenu>
                            <p:message for="rolSeleccionado" showSummary="true" showDetail="false" />
                        </p:outputPanel>

                        <p:outputPanel id="personaPanel" layout="block" styleClass="cambiar-rol-field">
                            <p:outputLabel for="personaRolSeleccionada" value="#{msg['cambiarRol.persona']}" />
                            <p:selectOneMenu id="personaRolSeleccionada"
                                             value="#{cambiarRolBean.personaRolSeleccionada}"
                                             disabled="#{empty cambiarRolBean.rolSeleccionado}"
                                             required="true"
                                             requiredMessage="#{msg['cambiarRol.personaRequerida']}">
                                <f:selectItem itemLabel="#{msg['cambiarRol.seleccionarPersona']}"
                                              itemValue="" noSelectionOption="true" />
                                <f:selectItems value="#{cambiarRolBean.personasDisponibles}" var="asignacion"
                                               itemLabel="#{cambiarRolBean.getNombrePersonaRol(asignacion)}"
                                               itemValue="#{asignacion.idPersonaRol.toString()}" />
                            </p:selectOneMenu>
                            <p:message for="personaRolSeleccionada" showSummary="true" showDetail="false" />
                        </p:outputPanel>

                        <div class="cambiar-rol-actions">
                            <p:commandButton value="#{msg['cambiarRol.aplicarBoton']}"
                                             icon="pi pi-sign-in"
                                             action="#{cambiarRolBean.aplicar}"
                                             process="@this clinicaSeleccionada rolPanel personaPanel"
                                             update="cambiarRolMessages" />
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </ui:define>
</ui:composition>
