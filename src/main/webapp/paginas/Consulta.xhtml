<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:crud="jakarta.faces.composite/crud"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:p="primefaces"
    xmlns:ui="jakarta.faces.facelets"
    template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="titulo">
        #{msg['consulta.titulo']} | #{msg['app.nombre']}
    </ui:define>

    <ui:define name="head">
        <h:outputStylesheet
            library="estilos"
            name="consulta.css"/>
    </ui:define>

    <ui:define name="contenido">
        <main class="page-shell">
            <section class="clinical-card">
                <div class="clinical-topbar"></div>

                <div class="card-content">
                    <div class="page-header">
                        <div class="header-info">
                            <div class="clinical-brand">
                                <span class="clinical-brand-icon">
                                    <i class="pi pi-calendar"></i>
                                </span>
                                #{msg['app.nombre']} - #{msg['app.areaTrabajo']}
                            </div>

                            <h1 class="page-title">
                                #{msg['consulta.titulo']}
                            </h1>

                            <p class="page-subtitle">
                                #{msg['consulta.subtitulo']}
                            </p>
                        </div>

                        <crud:botones-top
                            model="#{consultaModel}"
                            actualizar="messages consultasTable edicionDialog"
                            oncompleteNuevo="PF('consultaDialog').show()" />
                    </div>

                    <div class="section-divider"></div>

                    <p:messages
                        id="messages"
                        showDetail="true"
                        closable="true" />

                    <div class="table-section">
                        <div class="table-heading">
                            <div class="table-title">
                                <i class="pi pi-list"></i>
                                #{msg['consulta.lista']}
                            </div>
                        </div>

                        <p:dataTable
                            id="consultasTable"
                            value="#{consultaModel}"
                            var="item"
                            lazy="true"
                            paginator="true"
                            rows="10"
                            reflow="true"
                            selectionMode="single"
                            selection="#{consultaModel.seleccionado}"
                            rowKey="#{consultaModel.getRowKey(item)}"
                            emptyMessage="#{msg['consulta.sinRegistros']}"
                            styleClass="consulta-table">

                            <p:ajax
                                event="rowSelect"
                                listener="#{consultaModel.seleccionar(item)}"
                                update="edicionDialog"
                                oncomplete="PF('consultaDialog').show()" />

                            <p:column
                                headerText="#{msg['consulta.fechaInicio']}"
                                field="fechaInicio"
                                sortBy="#{item.fechaInicio}">

                                <h:outputText
                                    value="#{item.fechaInicio}"
                                    styleClass="consulta-date">
                                    <f:convertDateTime type="both" dateStyle="medium" timeStyle="short" />
                                </h:outputText>
                            </p:column>

                            <p:column
                                headerText="#{msg['consulta.fechaFin']}"
                                field="fechaFin"
                                sortBy="#{item.fechaFin}">

                                <h:outputText
                                    value="#{item.fechaFin}"
                                    styleClass="consulta-date">
                                    <f:convertDateTime type="both" dateStyle="medium" timeStyle="short" />
                                </h:outputText>
                            </p:column>

                            <p:column
                                headerText="#{msg['consulta.referenciaExterna']}"
                                field="referenciaExterna"
                                sortBy="#{item.referenciaExterna}"
                                filterBy="#{item.referenciaExterna}"
                                filterMatchMode="contains"
                                filterPlaceholder="#{msg['consulta.buscar']}">

                                <h:outputText
                                    value="#{empty item.referenciaExterna
                                             ? '-'
                                             : item.referenciaExterna}"
                                    styleClass="#{empty item.referenciaExterna
                                                  ? 'empty-note'
                                                  : 'consulta-ref'}" />
                            </p:column>

                            <p:column
                                headerText="#{msg['consulta.observaciones']}"
                                styleClass="observaciones-cell">

                                <h:outputText
                                    value="#{empty item.observaciones
                                             ? msg['consulta.sinObservaciones']
                                             : item.observaciones}"
                                    styleClass="#{empty item.observaciones
                                                  ? 'empty-note'
                                                  : ''}" />
                            </p:column>

                            <p:column
                                headerText="#{msg['consulta.personaRol']}"
                                styleClass="personarol-cell">

                                <h:outputText
                                    value="#{item.idPersonaRol.idPersona.nombres} #{item.idPersonaRol.idPersona.apellidos} - #{item.idPersonaRol.idRol.nombre}"
                                    styleClass="personarol-name" />
                            </p:column>

                            <p:column
                                headerText="#{msg['consulta.acciones']}"
                                styleClass="action-cell">

                                <p:commandButton
                                    icon="pi pi-pencil"
                                    title="#{msg['crud.editar']}"
                                    styleClass="edit-button"
                                    action="#{consultaModel.seleccionar(item)}"
                                    process="@this"
                                    update="edicionDialog"
                                    oncomplete="PF('consultaDialog').show()" />
                            </p:column>
                        </p:dataTable>
                    </div>
                </div>
            </section>
        </main>

        <p:dialog
            id="edicionDialog"
            widgetVar="consultaDialog"
            header="#{consultaModel.estado eq 'CREACION'
                      ? msg['consulta.nueva']
                      : msg['consulta.editar']}"
            modal="true"
            responsive="true"
            resizable="false"
            width="560"
            styleClass="clinical-dialog">

            <p:outputPanel
                id="edicionContenido"
                layout="block">

                <h:panelGroup rendered="#{consultaModel.seleccionado ne null}">
                    <div class="dialog-intro">
                        <div class="dialog-intro-icon">
                            <i class="pi pi-file-edit"></i>
                        </div>

                        <div>
                            <strong>
                                #{msg['consulta.informacion']}
                            </strong>

                            <span>
                                #{msg['consulta.completar']}
                            </span>
                        </div>
                    </div>

                    <div class="dialog-form">
                        <div class="form-field">
                            <p:outputLabel
                                for="fechaInicio"
                                value="#{msg['consulta.fechaInicio']}"
                                styleClass="form-label" />

                            <p:datePicker
                                id="fechaInicio"
                                value="#{consultaModel.seleccionado.fechaInicio}"
                                showIcon="true"
                                pattern="dd/MM/yyyy HH:mm"
                                showTime="true"
                                required="true"
                                requiredMessage="#{msg['mensajes.error']}" />
                        </div>

                        <div class="form-field">
                            <p:outputLabel
                                for="fechaFin"
                                value="#{msg['consulta.fechaFin']}"
                                styleClass="form-label" />

                            <p:datePicker
                                id="fechaFin"
                                value="#{consultaModel.seleccionado.fechaFin}"
                                showIcon="true"
                                pattern="dd/MM/yyyy HH:mm"
                                showTime="true" />
                        </div>

                        <div class="form-field">
                            <p:outputLabel
                                for="referenciaExterna"
                                value="#{msg['consulta.referenciaExterna']}"
                                styleClass="form-label" />

                            <p:inputText
                                id="referenciaExterna"
                                value="#{consultaModel.seleccionado.referenciaExterna}"
                                placeholder="#{msg['consulta.referenciaExternaPlaceholder']}" />
                        </div>

                        <div class="form-field">
                            <p:outputLabel
                                for="observaciones"
                                value="#{msg['consulta.observaciones']}"
                                styleClass="form-label" />

                            <p:inputTextarea
                                id="observaciones"
                                value="#{consultaModel.seleccionado.observaciones}"
                                rows="5"
                                autoResize="false"
                                placeholder="#{msg['consulta.observacionesPlaceholder']}" />
                        </div>

                        <div class="form-field">
                            <p:outputLabel
                                for="personaRol"
                                value="#{msg['consulta.personaRol']}"
                                styleClass="form-label" />

                            <p:selectOneMenu
                                id="personaRol"
                                value="#{consultaModel.seleccionado.idPersonaRol}"
                                converter="#{personaRolConverter}"
                                required="true"
                                requiredMessage="#{msg['mensajes.error']}">

                                <f:selectItem
                                    itemLabel="-- Seleccionar --"
                                    itemValue="#{null}" />

                                <f:selectItems
                                    value="#{consultaModel.personasRoles}"
                                    var="pr"
                                    itemLabel="#{pr.idPersona.nombres} #{pr.idPersona.apellidos} - #{pr.idRol.nombre}"
                                    itemValue="#{pr}" />
                            </p:selectOneMenu>
                        </div>
                    </div>

                    <div class="dialog-actions">
                        <crud:botones-bottom
                            model="#{consultaModel}"
                            procesar="@this edicionContenido"
                            actualizar="messages consultasTable edicionDialog"
                            oncompleteCancelar="PF('consultaDialog').hide()"
                            oncompleteGuardar="if (!args.validationFailed) PF('consultaDialog').hide()" />
                    </div>
                </h:panelGroup>
            </p:outputPanel>
        </p:dialog>
    </ui:define>
</ui:composition>
