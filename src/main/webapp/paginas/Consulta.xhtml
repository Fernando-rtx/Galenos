<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:crud="jakarta.faces.composite/crud"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:p="primefaces"
    xmlns:ui="jakarta.faces.facelets"
    template="/WEB-INF/plantillas/general.xhtml">

    <ui:define name="titulo">
        #{msg['consulta.titulo']} | #{msg['app.nombre']}
    </ui:define>

    <ui:define name="head">
        <h:outputStylesheet
            library="estilos"
            name="consulta.css"/>
        <h:outputStylesheet
            library="estilos"
            name="consulta-procedimiento-paso.css"/>
    </ui:define>

    <ui:define name="contenido">
        <main class="page-shell">
            <section class="clinical-card">
                <div class="clinical-topbar"></div>

                <div class="card-content">
                    <div class="page-header">
                        <div class="header-info">
                            <div class="clinical-brand">
                                <span class="clinical-brand-icon">
                                    <i class="pi pi-calendar"></i>
                                </span>
                                #{msg['app.nombre']} - #{msg['app.areaTrabajo']}
                            </div>

                            <h1 class="page-title">
                                #{msg['consulta.titulo']}
                            </h1>

                            <p class="page-subtitle">
                                #{msg['consulta.subtitulo']}
                            </p>
                        </div>

                        <h:panelGroup rendered="#{consultaModel.clinicaSeleccionada}">
                        <crud:botones-top
                            model="#{consultaModel}"
                            actualizar="messages consultasTable edicionDialog"
                            resetNuevo="true"
                            oncompleteNuevo="PF('consultaDialog').show()" />
                        </h:panelGroup>
                    </div>

                    <h:panelGroup rendered="#{not consultaModel.clinicaSeleccionada}" layout="block" role="status">
                        <h:outputText value="#{msg['clinicaActual.requerida']}" styleClass="form-helper" />
                    </h:panelGroup>
                    <div class="section-divider"></div>

                    <p:outputPanel id="messages" layout="block">
                        <p:messages
                            id="listaMessages"
                            rendered="#{consultaModel.estado eq 'LISTADO'}"
                            globalOnly="true"
                            redisplay="false"
                            showDetail="false"
                            closable="true" />
                    </p:outputPanel>

                    <div class="table-section">
                        <div class="table-heading">
                            <div class="table-title">
                                <i class="pi pi-list"></i>
                                #{msg['consulta.lista']}
                            </div>
                        </div>

                        <h:outputText
                            value="#{msg['crud.dobleClicEditar']}"
                            styleClass="page-subtitle" />

                        <p:outputPanel id="filtroFechas" layout="block" styleClass="consulta-filtros">
                            <div class="form-field">
                                <p:outputLabel for="fechaDesde" value="#{msg['consulta.desde']}" />
                                <p:datePicker id="fechaDesde" value="#{consultaModel.fechaDesde}"
                                              pattern="dd/MM/yyyy" showIcon="true" />
<p:message for="fechaDesde" showSummary="true" showDetail="false" />
                            </div>
                            <div class="form-field">
                                <p:outputLabel for="fechaHasta" value="#{msg['consulta.hasta']}" />
                                <p:datePicker id="fechaHasta" value="#{consultaModel.fechaHasta}"
                                              pattern="dd/MM/yyyy" showIcon="true" />
<p:message for="fechaHasta" showSummary="true" showDetail="false" />
                            </div>
                            <p:commandButton value="#{msg['consulta.buscarFechas']}" icon="pi pi-search"
                                action="#{consultaModel.aplicarFiltroFechas}" process="filtroFechas"
                                update="messages consultasTable"
                                oncomplete="if (!args.validationFailed) PF('consultasWidget').getPaginator().setPage(0)" />
                            <p:commandButton value="#{msg['consulta.limpiarFechas']}" icon="pi pi-times"
                                action="#{consultaModel.limpiarFiltroFechas}" process="@this"
                                update="filtroFechas messages consultasTable" resetValues="true"
                                oncomplete="PF('consultasWidget').getPaginator().setPage(0)" />
                        </p:outputPanel>

                        <p:dataTable
                            id="consultasTable"
                            widgetVar="consultasWidget"
                            value="#{consultaModel}"
                            var="item"
                            lazy="true"
                            paginator="true"
                            rows="10"
                            reflow="true"
                            selectionMode="single"
                            selection="#{consultaModel.seleccionado}"
                            rowKey="#{consultaModel.getRowKey(item)}"
                            emptyMessage="#{msg['consulta.sinRegistros']}"
                            styleClass="clinical-table">

                            <p:ajax
                                event="rowDblselect"
                                listener="#{consultaModel.seleccionarFila}"
                                process="@this"
                                update="messages edicionDialog"
                                resetValues="true"
                                oncomplete="PF('consultaDialog').show()" />

                            <p:column
                                headerText="#{msg['consulta.fechaInicio']}"
                                field="fechaInicio"
                                sortBy="#{item.fechaInicio}">

                                <h:outputText
                                    value="#{item.fechaInicio}"
                                    styleClass="consulta-date">
                                    <f:convertDateTime type="both" dateStyle="medium" timeStyle="short" timeZone="America/El_Salvador" />
                                </h:outputText>
                            </p:column>

                            <p:column
                                headerText="#{msg['consulta.fechaFin']}"
                                field="fechaFin"
                                sortBy="#{item.fechaFin}">

                                <h:outputText
                                    value="#{item.fechaFin}"
                                    styleClass="consulta-date">
                                    <f:convertDateTime type="both" dateStyle="medium" timeStyle="short" timeZone="America/El_Salvador" />
                                </h:outputText>
                            </p:column>

                            <p:column
                                headerText="#{msg['consulta.referenciaExterna']}"
                                field="referenciaExterna"
                                sortBy="#{item.referenciaExterna}"
                                filterBy="#{item.referenciaExterna}"
                                filterMatchMode="contains"
                                filterPlaceholder="#{msg['consulta.buscar']}">

                                <h:outputText
                                    value="#{empty item.referenciaExterna
                                             ? '-'
                                             : item.referenciaExterna}"
                                    styleClass="#{empty item.referenciaExterna
                                                  ? 'empty-note'
                                                  : 'consulta-ref'}" />
                            </p:column>

                            <p:column
                                headerText="#{msg['consulta.observaciones']}"
                                styleClass="observaciones-cell">

                                <h:outputText
                                    value="#{empty item.observaciones
                                             ? msg['consulta.sinObservaciones']
                                             : item.observaciones}"
                                    styleClass="#{empty item.observaciones
                                                  ? 'empty-note'
                                                  : ''}" />
                            </p:column>

                            <p:column
                                headerText="#{msg['consulta.personaRol']}"
                                styleClass="personarol-cell">

                                <h:outputText
                                    value="#{item.idPersonaRol.idPersona.nombres} #{item.idPersonaRol.idPersona.apellidos} - #{item.idPersonaRol.idRol.nombre}"
                                    styleClass="personarol-name" />
                            </p:column>
                        </p:dataTable>
                    </div>
                </div>
            </section>
        </main>

        <p:dialog
            id="edicionDialog"
            widgetVar="consultaDialog"
            header="#{consultaModel.estado eq 'CREACION'
                      ? msg['consulta.nueva']
                      : msg['consulta.editar']}"
            modal="true"
            responsive="true"
            resizable="false"
            focus=":layoutForm:edicionDialog"
            width="900"
            styleClass="clinical-dialog">

            <p:outputPanel
                id="edicionContenido"
                layout="block">

                <p:messages id="consultaMessages" globalOnly="true" redisplay="false"
                            rendered="#{consultaModel.estado ne 'LISTADO'}"
                            showDetail="false" closable="true" />

                <h:panelGroup rendered="#{consultaModel.seleccionado ne null}">
                    <p:tabView id="consultaTabs">
                        <p:ajax event="tabChange" process="@this"
                                update=":layoutForm:consultaMessages :layoutForm:consultaTabs:detalleConsulta :layoutForm:consultaTabs:procedimientosContenido :layoutForm:consultaTabs:pasosContenido" />

                        <p:tab title="#{msg['consulta.tab.detalle']}">
                            <div class="dialog-intro">
                                <div class="dialog-intro-icon">
                                    <i class="pi pi-file-edit"></i>
                                </div>

                                <div>
                                    <strong>
                                        #{msg['consulta.informacion']}
                                    </strong>

                                    <span>
                                        #{msg['consulta.completar']}
                                    </span>
                                </div>
                            </div>

                            <p:outputPanel
                                id="detalleConsulta"
                                layout="block"
                                styleClass="dialog-form">
                                <div class="form-field">
                                    <p:outputLabel
                                        for="consultaFechaInicio"
                                        value="#{msg['consulta.fechaInicio']}"
                                        styleClass="form-label" />

                                    <p:datePicker
                                        id="consultaFechaInicio"
                                        value="#{consultaModel.seleccionado.fechaInicio}"
                                        showIcon="true"
                                        pattern="dd/MM/yyyy HH:mm"
                                        showTime="true" timeInput="true" timeZone="America/El_Salvador"
                                        required="true"
                                        requiredMessage="#{msg['consultaFlujo.fechasInvalidas']}" />

<p:message for="consultaFechaInicio" showSummary="true" showDetail="false" />
                                </div>

                                <div class="form-field">
                                    <p:outputLabel
                                        for="consultaFechaFin"
                                        value="#{msg['consulta.fechaFin']}"
                                        styleClass="form-label" />

                                    <p:datePicker
                                        id="consultaFechaFin"
                                        value="#{consultaModel.seleccionado.fechaFin}"
                                        showIcon="true"
                                        pattern="dd/MM/yyyy HH:mm"
                                        showTime="true" timeInput="true" timeZone="America/El_Salvador"
                                        validator="#{consultaModel.validarFechaFin}" />

<p:message for="consultaFechaFin" showSummary="true" showDetail="false" />
                                </div>

                                <div class="form-field">
                                    <p:outputLabel
                                        for="consultaReferenciaExterna"
                                        value="#{msg['consulta.referenciaExterna']}"
                                        styleClass="form-label" />

                                    <p:inputText
                                        id="consultaReferenciaExterna"
                                        value="#{consultaModel.seleccionado.referenciaExterna}"
                                        placeholder="#{msg['consulta.referenciaExternaPlaceholder']}" />
                                </div>

                                <div class="form-field">
                                    <p:outputLabel
                                        for="consultaObservaciones"
                                        value="#{msg['consulta.observaciones']}"
                                        styleClass="form-label" />

                                    <p:inputTextarea
                                        id="consultaObservaciones"
                                        value="#{consultaModel.seleccionado.observaciones}"
                                        rows="5"
                                        autoResize="false"
                                        placeholder="#{msg['consulta.observacionesPlaceholder']}" />
                                </div>

                                <div class="form-field">
                                    <p:outputLabel
                                        for="consultaPersonaRol"
                                        value="#{msg['consulta.paciente']}"
                                        styleClass="form-label" />

                                    <p:autoComplete
                                        id="consultaPersonaRol"
                                        disabled="#{consultaModel.estado eq 'EDICION'}"
                                        value="#{consultaModel.seleccionado.idPersonaRol}"
                                        converter="#{personaRolConverter}"
                                        completeMethod="#{consultaModel.buscarPacientes}"
                                        var="paciente"
                                        itemLabel="#{consultaModel.getEtiquetaPaciente(paciente)}"
                                        itemValue="#{paciente}"
                                        placeholder="#{msg['consulta.buscarPacientePlaceholder']}"
                                        forceSelection="true"
                                        dropdown="false"
                                        minQueryLength="2"
                                        queryDelay="250"
                                        scrollHeight="240"
                                        emptyMessage="#{msg['consulta.sinPacientes']}"
                                        required="true"
                                        requiredMessage="#{msg['consultaFlujo.pacienteInvalido']}">

                                        <p:column headerText="#{msg['consulta.paciente']}">
                                            <h:outputText
                                                value="#{paciente.idPersona.nombres} #{paciente.idPersona.apellidos}" />
                                        </p:column>

                                        <p:column headerText="#{msg['consulta.fechaNacimiento']}">
                                            <h:outputText value="#{paciente.idPersona.fechaNacimiento}">
                                                <f:convertDateTime pattern="dd/MM/yyyy" timeZone="America/El_Salvador" />
                                            </h:outputText>
                                        </p:column>
                                        <p:column headerText="#{msg['consulta.documentoDui']}">
                                            <h:outputText
                                                value="#{empty consultaModel.getDui(paciente)
                                                         ? msg['consulta.sinDui']
                                                         : consultaModel.getDui(paciente)}" />
                                        </p:column>
                                    </p:autoComplete>

<p:message for="consultaPersonaRol" showSummary="true" showDetail="false" />
                                </div>
                            </p:outputPanel>

                            <div class="dialog-actions">
                                <crud:botones-bottom
                                    model="#{consultaModel}"
                                    procesar="detalleConsulta"
                                    actualizar=":layoutForm:messages :layoutForm:consultasTable :layoutForm:edicionContenido"
                                    oncompleteCancelar="PF('consultaDialog').hide()"
                                    oncompleteGuardar="if (args &amp;&amp; !args.validationFailed) PF('consultaDialog').hide()" />
                            </div>
                        </p:tab>

                        <p:tab title="#{msg['consulta.tab.procedimientos']}"
                               disabled="#{consultaModel.seleccionado.idConsulta eq null}">
                            <p:outputPanel id="procedimientosContenido">
                                <p:commandButton
                                    value="#{msg['consultaProcedimiento.nuevo']}"
                                    icon="pi pi-plus"
                                    action="#{consultaProcedimientoModel.nuevoParaConsulta(consultaModel.seleccionado)}"
                                    process="@this"
                                    update="procedimientosContenido :layoutForm:consultaMessages"  resetValues="true" />

                                <p:dataTable
                                    id="consultaProcedimientoTable"
                                    value="#{consultaProcedimientoModel.getProcedimientosPorConsulta(consultaModel.seleccionado)}"
                                    var="procedimiento"
                                    selectionMode="single"
                                    selection="#{consultaProcedimientoModel.seleccionado}"
                                    rowKey="#{consultaProcedimientoModel.getRowKey(procedimiento)}"
                                    emptyMessage="#{msg['consultaProcedimiento.sinRegistros']}"
                                    styleClass="clinical-table">
                                    <p:ajax
                                        event="rowDblselect"
                                        listener="#{consultaProcedimientoModel.seleccionarParaConsulta(consultaProcedimientoModel.seleccionado, consultaModel.seleccionado)}"
                                        process="@this"
                                        update="procedimientosContenido :layoutForm:consultaMessages"
                                        resetValues="true" />

                                    <p:column
                                        headerText="#{msg['consultaProcedimiento.procedimiento']}">
                                        <h:outputText value="#{consultaProcedimientoModel.getNombreProcedimiento(procedimiento)}" />
                                    </p:column>

                                    <p:column
                                        headerText="#{msg['consultaProcedimiento.fechaInicio']}">
                                        <h:outputText value="#{procedimiento.fechaInicio}">
                                            <f:convertDateTime type="both" dateStyle="medium" timeStyle="short" timeZone="America/El_Salvador" />
                                        </h:outputText>
                                    </p:column>

                                    <p:column
                                        headerText="#{msg['consultaProcedimiento.fechaFin']}">
                                        <h:outputText value="#{procedimiento.fechaFin}">
                                            <f:convertDateTime type="both" dateStyle="medium" timeStyle="short" timeZone="America/El_Salvador" />
                                        </h:outputText>
                                    </p:column>

                                    <p:column
                                        headerText="#{msg['consultaProcedimiento.observaciones']}"
                                        styleClass="observaciones-cell">
                                        <h:outputText
                                            value="#{empty procedimiento.observaciones
                                                     ? msg['consultaProcedimiento.sinObservaciones']
                                                     : procedimiento.observaciones}" />
                                    </p:column>
                                </p:dataTable>

                                <h:panelGroup rendered="#{consultaProcedimientoModel.isSeleccionadoParaConsulta(consultaModel.seleccionado)}">
                                    <p:outputPanel
                                        id="procedimientoForm"
                                        layout="block"
                                        styleClass="dialog-form">
                                        <div class="form-field">
                                            <p:outputLabel
                                                for="procedimientoIdProcedimiento"
                                                value="#{msg['consultaProcedimiento.procedimiento']}"
                                                styleClass="form-label" />

                                            <p:selectOneMenu
                                                id="procedimientoIdProcedimiento"
                                                disabled="#{consultaProcedimientoModel.estado eq 'EDICION'}"
                                                value="#{consultaProcedimientoModel.seleccionado.idProcedimiento}"
                                                required="true"
                                                requiredMessage="#{msg['consultaFlujo.procedimientoInactivo']}">

                                                <f:selectItem
                                                    itemLabel="#{msg['crud.seleccionar']}"
                                                    itemValue="#{null}"
                                                    noSelectionOption="true" />

                                                <f:selectItems
                                                    value="#{consultaProcedimientoModel.procedimientos}"
                                                    var="p"
                                                    itemLabel="#{p.nombre}"
                                                    itemValue="#{p.idProcedimiento}" />
                                            </p:selectOneMenu>

<p:message for="procedimientoIdProcedimiento" showSummary="true" showDetail="false" />
                                        </div>

                                        <div class="form-field">
                                            <p:outputLabel
                                                for="procedimientoFechaInicio"
                                                value="#{msg['consultaProcedimiento.fechaInicio']}"
                                                styleClass="form-label" />

                                            <p:datePicker
                                                id="procedimientoFechaInicio"
                                                value="#{consultaProcedimientoModel.seleccionado.fechaInicio}"
                                                showIcon="true"
                                                pattern="dd/MM/yyyy HH:mm"
                                                showTime="true" timeInput="true" timeZone="America/El_Salvador"
                                                required="true"
                                                requiredMessage="#{msg['consultaFlujo.fechasInvalidas']}" />

<p:message for="procedimientoFechaInicio" showSummary="true" showDetail="false" />
                                        </div>

                                        <div class="form-field">
                                            <p:outputLabel
                                                for="procedimientoFechaFin"
                                                value="#{msg['consultaProcedimiento.fechaFin']}"
                                                styleClass="form-label" />

                                            <p:datePicker
                                                id="procedimientoFechaFin"
                                                value="#{consultaProcedimientoModel.seleccionado.fechaFin}"
                                                showIcon="true"
                                                pattern="dd/MM/yyyy HH:mm"
                                                showTime="true" timeInput="true" timeZone="America/El_Salvador"
                                                validator="#{consultaProcedimientoModel.validarFechaFin}" />

<p:message for="procedimientoFechaFin" showSummary="true" showDetail="false" />
                                        </div>

                                        <div class="form-field">
                                            <p:outputLabel
                                                for="procedimientoObservaciones"
                                                value="#{msg['consultaProcedimiento.observaciones']}"
                                                styleClass="form-label" />

                                            <p:inputTextarea
                                                id="procedimientoObservaciones"
                                                value="#{consultaProcedimientoModel.seleccionado.observaciones}"
                                                rows="5"
                                                autoResize="false"
                                                placeholder="#{msg['consultaProcedimiento.observacionesPlaceholder']}" />
                                        </div>
                                    </p:outputPanel>

                                    <div class="dialog-actions">
                                        <p:commandButton
                                            value="#{msg['crud.cancelar']}"
                                            action="#{consultaProcedimientoModel.cancelar()}"
                                            process="@this"
                                            update="procedimientosContenido :layoutForm:consultaMessages"
                                            immediate="true"
                                            resetValues="true" />
                                        <p:commandButton
                                            value="#{msg['crud.guardar']}"
                                            action="#{consultaProcedimientoModel.guardar()}"
                                            process="procedimientoForm"
                                            update=":layoutForm:messages :layoutForm:consultaMessages :layoutForm:consultaTabs:procedimientosContenido :layoutForm:consultaTabs:pasosContenido" />
                                    </div>
                                </h:panelGroup>
                            </p:outputPanel>
                        </p:tab>

                        <p:tab title="#{msg['consulta.tab.pasos']}"
                               disabled="#{consultaModel.seleccionado.idConsulta eq null}">
                            <p:outputPanel id="pasosContenido">
                                <h:outputText value="#{msg['consultaFlujo.pasoAutomaticoAyuda']}" styleClass="form-helper" />

                                <p:dataTable
                                    id="consultaProcedimientoPasoTable"
                                    value="#{consultaProcedimientoPasoModel.getPasosPorConsulta(consultaModel.seleccionado)}"
                                    var="paso"
                                    selectionMode="single"
                                    selection="#{consultaProcedimientoPasoModel.seleccionado}"
                                    rowKey="#{consultaProcedimientoPasoModel.getRowKey(paso)}"
                                    emptyMessage="#{msg['consultaProcedimientoPaso.sinRegistros']}"
                                    styleClass="clinical-table">
                                    <p:ajax
                                        event="rowDblselect"
                                        listener="#{consultaProcedimientoPasoModel.seleccionarParaConsulta(consultaProcedimientoPasoModel.seleccionado, consultaModel.seleccionado)}"
                                        process="@this"
                                        update="pasosContenido :layoutForm:consultaMessages"
                                        resetValues="true" />

                                    <p:column
                                        headerText="#{msg['consultaProcedimientoPaso.consultaProcedimiento']}"
                                        styleClass="consulta-proc-cell">
                                        <h:outputText
                                            value="#{consultaProcedimientoModel.getNombreProcedimiento(paso.idConsultaProcedimiento)}" />
                                    </p:column>

                                    <p:column
                                        headerText="#{msg['consultaProcedimientoPaso.personaRol']}"
                                        styleClass="persona-rol-cell">
                                        <h:outputText
                                            value="#{paso.idPersonaRol.idPersona.nombres} #{paso.idPersonaRol.idPersona.apellidos} - #{paso.idPersonaRol.idRol.nombre}"
                                            styleClass="persona-rol-text" />
                                    </p:column>

                                    <p:column
                                        headerText="#{msg['consultaProcedimientoPaso.fechaInicio']}">
                                        <h:outputText value="#{paso.fechaInicio}">
                                            <f:convertDateTime type="both" dateStyle="medium" timeStyle="short" timeZone="America/El_Salvador" />
                                        </h:outputText>
                                    </p:column>

                                    <p:column
                                        headerText="#{msg['consultaProcedimientoPaso.fechaFin']}">
                                        <h:outputText value="#{paso.fechaFin}">
                                            <f:convertDateTime type="both" dateStyle="medium" timeStyle="short" timeZone="America/El_Salvador" />
                                        </h:outputText>
                                    </p:column>

                                    <p:column
                                        headerText="#{msg['consultaProcedimientoPaso.estado']}">
                                        <h:outputText
                                            value="#{paso.estado}"
                                            styleClass="estado-badge #{paso.estado eq 'COMPLETADO' ? 'estado-completado' : paso.estado eq 'EN_CURSO' ? 'estado-en-curso' : 'estado-pendiente'}" />
                                    </p:column>
                                </p:dataTable>

                                <h:panelGroup rendered="#{consultaProcedimientoPasoModel.isFormularioVisibleParaConsulta(consultaModel.seleccionado)}">
                                    <div class="context-actions">
                                        <h:link outcome="/paginas/OrdenExamen"
                                                value="#{msg['consultaProcedimientoPaso.ordenes']}"
                                                styleClass="context-link"
                                                rendered="#{consultaProcedimientoPasoModel.seleccionado.idConsultaProcedimientoPaso ne null}">
                                            <f:param name="idPaso" value="#{consultaProcedimientoPasoModel.seleccionado.idConsultaProcedimientoPaso}" />
                                        </h:link>
                                    </div>
                                    <p:outputPanel
                                        id="pasoForm"
                                        layout="block"
                                        styleClass="dialog-form">
                                        <div class="form-field">
                                            <p:outputLabel
                                                for="pasoConsultaProcedimiento"
                                                value="#{msg['consultaProcedimientoPaso.consultaProcedimiento']}"
                                                styleClass="form-label" />

                                            <p:selectOneMenu
                                                id="pasoConsultaProcedimiento"
                                                disabled="true"
                                                value="#{consultaProcedimientoPasoModel.seleccionado.idConsultaProcedimiento}"
                                                converter="#{consultaProcedimientoConverter}"
                                                required="true"
                                                requiredMessage="#{msg['mensajes.error']}">

                                                <f:selectItem
                                                    itemLabel="#{msg['crud.seleccionar']}"
                                                    itemValue="#{null}" />

                                                <f:selectItems
                                                    value="#{consultaProcedimientoPasoModel.getConsultaProcedimientosPorConsulta(consultaModel.seleccionado)}"
                                                    var="cp"
                                                    itemLabel="#{consultaProcedimientoModel.getNombreProcedimiento(cp)}"
                                                    itemValue="#{cp}" />
                                            </p:selectOneMenu>

<p:message for="pasoConsultaProcedimiento" showSummary="true" showDetail="false" />
                                        </div>

                                        <div class="form-field">
                                            <p:outputLabel
                                                for="pasoPersonaRol"
                                                value="#{msg['consultaFlujo.responsable']}"
                                                styleClass="form-label" />

                                            <h:outputText id="pasoPersonaRol"
                                                value="#{consultaProcedimientoPasoModel.getEtiquetaMedico(consultaProcedimientoPasoModel.seleccionado.idPersonaRol)}" />

<p:message for="pasoPersonaRol" showSummary="true" showDetail="false" />
                                        </div>

                                        <div class="form-field">
                                            <p:outputLabel
                                                for="pasoFechaInicio"
                                                value="#{msg['consultaProcedimientoPaso.fechaInicio']}"
                                                styleClass="form-label" />

                                            <p:datePicker
                                                id="pasoFechaInicio"
                                                value="#{consultaProcedimientoPasoModel.seleccionado.fechaInicio}"
                                                showIcon="true"
                                                pattern="dd/MM/yyyy HH:mm"
                                                showTime="true" timeInput="true" timeZone="America/El_Salvador"
                                                required="true"
                                                requiredMessage="#{msg['consultaFlujo.fechasInvalidas']}" />

<p:message for="pasoFechaInicio" showSummary="true" showDetail="false" />
                                        </div>

                                        <div class="form-field">
                                            <p:outputLabel
                                                for="pasoFechaFin"
                                                value="#{msg['consultaProcedimientoPaso.fechaFin']}"
                                                styleClass="form-label" />

                                            <p:datePicker
                                                id="pasoFechaFin"
                                                value="#{consultaProcedimientoPasoModel.seleccionado.fechaFin}"
                                                showIcon="true"
                                                pattern="dd/MM/yyyy HH:mm"
                                                showTime="true" timeInput="true" timeZone="America/El_Salvador"
                                                validator="#{consultaProcedimientoPasoModel.validarFechaFin}" />

<p:message for="pasoFechaFin" showSummary="true" showDetail="false" />
                                        </div>

                                        <div class="form-field">
                                            <p:outputLabel
                                                for="pasoEstado"
                                                value="#{msg['consultaProcedimientoPaso.estado']}"
                                                styleClass="form-label" />

                                            <p:selectOneMenu
                                                id="pasoEstado"
                                                value="#{consultaProcedimientoPasoModel.seleccionado.estado}"
                                                required="true"
                                                requiredMessage="#{msg['consultaFlujo.estadoInvalido']}">

                                                <f:selectItem
                                                    itemLabel="#{msg['crud.seleccionar']}"
                                                    itemValue="#{null}" />

                                                <f:selectItem
                                                    itemLabel="#{msg['estado.pendiente']}"
                                                    itemValue="PENDIENTE" />

                                                <f:selectItem
                                                    itemLabel="#{msg['estado.enCurso']}"
                                                    itemValue="EN_CURSO" />

                                                <f:selectItem
                                                    itemLabel="#{msg['estado.completado']}"
                                                    itemValue="COMPLETADO" />
                                            </p:selectOneMenu>

<p:message for="pasoEstado" showSummary="true" showDetail="false" />
                                        </div>
                                    </p:outputPanel>

                                    <div class="dialog-actions">
                                        <p:commandButton
                                            value="#{msg['crud.cancelar']}"
                                            action="#{consultaProcedimientoPasoModel.cancelar()}"
                                            process="@this"
                                            update="pasosContenido :layoutForm:consultaMessages"
                                            immediate="true"
                                            resetValues="true" />
                                        <p:commandButton
                                            value="#{msg['crud.guardar']}"
                                            action="#{consultaProcedimientoPasoModel.guardar()}"
                                            process="pasoForm"
                                            update=":layoutForm:messages :layoutForm:consultaMessages pasosContenido" />
                                    </div>
                                </h:panelGroup>
                            </p:outputPanel>
                        </p:tab>
                    </p:tabView>
                </h:panelGroup>
            </p:outputPanel>
        </p:dialog>
    </ui:define>
</ui:composition>
