<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:crud="jakarta.faces.composite/crud"
                xmlns:h="jakarta.faces.html"
                xmlns:p="primefaces"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/plantillas/general.xhtml">
    <ui:define name="titulo">#{msg['examen.titulo']} | #{msg['app.nombre']}</ui:define>
    <ui:define name="head">
        <h:outputStylesheet library="estilos"
                            name="examen.css" />
    </ui:define>
    <ui:define name="contenido">
        <!-- Encabezado -->
        <main class="page-shell">
            <section class="clinical-card">
                <div class="clinical-topbar"></div>
                <div class="card-content">
                    <div class="page-header">
                        <div>
                            <h1 class="page-title">#{msg['examen.titulo']}</h1>
                            <p class="page-subtitle">#{msg['examen.subtitulo']}</p>
                        </div>
                        <crud:botones-top model="#{examenModel}"
                                          actualizar="messages examenTable edicionDialog"
                                          oncompleteNuevo="PF('examenDialog').show()" />
                    </div>
                    <div class="section-divider"></div>
                    <p:messages id="messages"
                                showDetail="true"
                                closable="true" />

                    <!-- Tabla principal -->
                    <div class="table-title">#{msg['examen.lista']}</div>
                    <p:dataTable id="examenTable"
                                 value="#{examenModel}"
                                 var="item"
                                 lazy="true"
                                 paginator="true"
                                 rows="10"
                                 reflow="true"
                                 selectionMode="single"
                                 selection="#{examenModel.seleccionado}"
                                 rowKey="#{examenModel.getRowKey(item)}"
                                 emptyMessage="#{msg['examen.sinRegistros']}"
                                 styleClass="clinical-table examen-table">
                        <p:ajax event="rowSelect"
                                listener="#{examenModel.seleccionar(item)}"
                                update="edicionDialog"
                                oncomplete="PF('examenDialog').show()" />
                        <p:column headerText="#{msg['examen.nombre']}"
                                  field="nombre"
                                  sortBy="#{item.nombre}"
                                  filterBy="#{item.nombre}"
                                  filterMatchMode="contains">
                            <h:outputText value="#{item.nombre}" />
                        </p:column>
                        <p:column headerText="#{msg['examen.observaciones']}"
                                  styleClass="observaciones">
                            <h:outputText value="#{empty item.observaciones ? msg['comun.sinDato'] : item.observaciones}" />
                        </p:column>
                        <p:column headerText="#{msg['examen.estado']}">
                            <p:tag value="#{item.activo eq true ? msg['examen.activo'] : msg['examen.inactivo']}"
                                   severity="#{item.activo eq true ? 'success' : 'secondary'}" />
                        </p:column>
                        <p:column headerText="#{msg['comun.acciones']}"
                                  styleClass="action-cell">
                            <p:commandButton icon="pi pi-pencil"
                                             title="#{msg['crud.editar']}"
                                             action="#{examenModel.seleccionar(item)}"
                                             process="@this"
                                             update="edicionDialog"
                                             oncomplete="PF('examenDialog').show()"
                                             styleClass="edit-button" />
                        </p:column>
                    </p:dataTable>
                </div>
            </section>
        </main>

        <!-- Diálogo de edición -->
        <p:dialog id="edicionDialog"
                  widgetVar="examenDialog"
                  header="#{examenModel.estado eq 'CREACION' ? msg['examen.nuevo'] : msg['examen.editar']}"
                  modal="true"
                  responsive="true"
                  resizable="false"
                  width="560"
                  styleClass="clinical-dialog">
            <p:outputPanel id="edicionContenido">
                <h:panelGroup rendered="#{examenModel.seleccionado ne null}">
                    <div class="dialog-form">
                        <div class="form-field">
                            <p:outputLabel for="nombre"
                                           value="#{msg['examen.nombre']}" />
                            <p:inputText id="nombre"
                                         value="#{examenModel.seleccionado.nombre}"
                                         required="true"
                                         requiredMessage="#{msg['examen.nombreRequerido']}"
                                         maxlength="255"
                                         validator="#{examenModel.validarNombre}" />

                            <p:message for="nombre" />
                        </div>
                        <div class="form-field">
                            <p:outputLabel for="observaciones"
                                           value="#{msg['examen.observaciones']}" />
                            <p:inputTextarea id="observaciones"
                                             value="#{examenModel.seleccionado.observaciones}"
                                             rows="4" />
                        </div>
                        <div class="form-field">
                            <p:outputLabel for="activo"
                                           value="#{msg['examen.activo']}" />
                            <p:toggleSwitch id="activo"
                                            value="#{examenModel.seleccionado.activo}" />
                        </div>
                    </div>
                    <div class="dialog-actions">
                        <crud:botones-bottom model="#{examenModel}"
                                             procesar="@this edicionContenido"
                                             actualizar="messages examenTable edicionDialog"
                                             oncompleteCancelar="PF('examenDialog').hide()"
                                             oncompleteGuardar="if (!args.validationFailed) PF('examenDialog').hide()" />
                    </div>
                </h:panelGroup>
            </p:outputPanel>
        </p:dialog>
    </ui:define>
</ui:composition>
