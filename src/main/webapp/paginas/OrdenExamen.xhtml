<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:crud="jakarta.faces.composite/crud"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:p="primefaces"
    xmlns:ui="jakarta.faces.facelets"
    template="/WEB-INF/plantillas/general.xhtml">

    <f:metadata>
        <f:viewParam name="idPaso" value="#{ordenExamenModel.idPasoContexto}" />
    </f:metadata>

    <ui:define name="titulo">
        #{msg['ordenExamen.titulo']} | #{msg['app.nombre']}
    </ui:define>

    <ui:define name="head">
        <h:outputStylesheet
            library="estilos"
            name="orden-examen.css"/>
    </ui:define>

    <ui:define name="contenido">
        <main class="page-shell">
            <section class="clinical-card">
                <div class="clinical-topbar"></div>

                <div class="card-content">
                    <div class="page-header">
                        <div class="header-info">
                            <div class="clinical-brand">
                                <span class="clinical-brand-icon">
                                    <i class="pi pi-file-edit"></i>
                                </span>
                                #{msg['app.nombre']} - #{msg['app.areaTrabajo']}
                            </div>

                            <h1 class="page-title">
                                #{msg['ordenExamen.titulo']}
                            </h1>

                            <p class="page-subtitle">
                                #{msg['ordenExamen.subtitulo']}
                            </p>
                        </div>

                        <crud:botones-top
                            model="#{ordenExamenModel}"
                            actualizar="messages ordenExamenTable edicionDialog"
                            oncompleteNuevo="PF('ordenExamenDialog').show()" />
                    </div>

                    <div class="section-divider"></div>

                    <p:messages
                        id="messages"
                        showDetail="true"
                        closable="true" />

                    <div class="table-section">
                        <div class="table-heading">
                            <div class="table-title">
                                <i class="pi pi-list"></i>
                                #{msg['ordenExamen.lista']}
                            </div>
                        </div>

                        <p:dataTable
                            id="ordenExamenTable"
                            value="#{ordenExamenModel}"
                            var="item"
                            lazy="true"
                            paginator="true"
                            rows="10"
                            reflow="true"
                            selectionMode="single"
                            selection="#{ordenExamenModel.seleccionado}"
                            rowKey="#{ordenExamenModel.getRowKey(item)}"
                            emptyMessage="#{msg['ordenExamen.sinRegistros']}"
                            styleClass="orden-examen-table">

                            <p:ajax
                                event="rowSelect"
                                listener="#{ordenExamenModel.seleccionar(item)}"
                                update="edicionDialog"
                                oncomplete="PF('ordenExamenDialog').show()" />

                            <p:column
                                headerText="#{msg['ordenExamen.consultaProcedimientoPaso']}"
                                styleClass="paso-cell">

                                <h:outputText
                                    value="#{item.idConsultaProcedimientoPaso.idConsultaProcedimiento.idConsulta.referenciaExterna} - #{item.idConsultaProcedimientoPaso.estado}"
                                    styleClass="paso-text" />
                            </p:column>

                            <p:column
                                headerText="#{msg['ordenExamen.fechaCreacion']}"
                                field="fechaCreacion"
                                sortBy="#{item.fechaCreacion}">

                                <h:outputText
                                    value="#{item.fechaCreacion}"
                                    styleClass="paso-date">
                                    <f:convertDateTime type="both" dateStyle="medium" timeStyle="short" />
                                </h:outputText>
                            </p:column>

                            <p:column
                                headerText="#{msg['ordenExamen.indicaciones']}"
                                styleClass="indicaciones-cell">

                                <h:outputText
                                    value="#{item.indicaciones != null ? item.indicaciones : msg['ordenExamen.sinIndicaciones']}"
                                    styleClass="#{item.indicaciones != null ? 'indicaciones-text' : 'empty-note'}" />
                            </p:column>

                            <p:column
                                headerText="#{msg['ordenExamen.resultados']}"
                                styleClass="action-cell">

                                <h:link outcome="/paginas/ExamenResultado" value="#{msg['crud.ver']}">
                                    <f:param name="idOrden" value="#{item.idOrdenExamen}" />
                                </h:link>
                            </p:column>

                            <p:column
                                headerText="#{msg['ordenExamen.acciones']}"
                                styleClass="action-cell">

                                <p:commandButton
                                    icon="pi pi-pencil"
                                    title="#{msg['crud.editar']}"
                                    styleClass="edit-button"
                                    action="#{ordenExamenModel.seleccionar(item)}"
                                    process="@this"
                                    update="edicionDialog"
                                    oncomplete="PF('ordenExamenDialog').show()" />
                            </p:column>
                        </p:dataTable>
                    </div>
                </div>
            </section>
        </main>

        <p:dialog
            id="edicionDialog"
            widgetVar="ordenExamenDialog"
            header="#{ordenExamenModel.estado eq 'CREACION'
                      ? msg['ordenExamen.nueva']
                      : msg['ordenExamen.editar']}"
            modal="true"
            responsive="true"
            resizable="false"
            width="560"
            styleClass="clinical-dialog">

            <p:outputPanel
                id="edicionContenido"
                layout="block">

                <h:panelGroup rendered="#{ordenExamenModel.seleccionado ne null}">
                    <div class="dialog-intro">
                        <div class="dialog-intro-icon">
                            <i class="pi pi-file-edit"></i>
                        </div>

                        <div>
                            <strong>
                                #{msg['ordenExamen.informacion']}
                            </strong>

                            <span>
                                #{msg['ordenExamen.completar']}
                            </span>
                        </div>
                    </div>

                    <div class="dialog-form">
                        <div class="form-field">
                            <p:outputLabel
                                for="consultaProcedimientoPaso"
                                value="#{msg['ordenExamen.consultaProcedimientoPaso']}"
                                styleClass="form-label" />

                            <p:selectOneMenu
                                id="consultaProcedimientoPaso"
                                value="#{ordenExamenModel.seleccionado.idConsultaProcedimientoPaso}"
                                converter="#{consultaProcedimientoPasoConverter}"
                                required="true"
                                requiredMessage="#{msg['mensajes.error']}">

                                <f:selectItem
                                    itemLabel="#{msg['crud.seleccionar']}"
                                    itemValue="#{null}" />

                                <f:selectItems
                                    value="#{ordenExamenModel.consultaProcedimientoPasos}"
                                    var="cpp"
                                    itemLabel="#{cpp.idConsultaProcedimiento.idConsulta.referenciaExterna} - #{cpp.estado}"
                                    itemValue="#{cpp}" />
                            </p:selectOneMenu>
                        </div>

                        <div class="form-field">
                            <p:outputLabel
                                for="fechaCreacion"
                                value="#{msg['ordenExamen.fechaCreacion']}"
                                styleClass="form-label" />

                            <p:datePicker
                                id="fechaCreacion"
                                value="#{ordenExamenModel.seleccionado.fechaCreacion}"
                                showIcon="true"
                                pattern="dd/MM/yyyy HH:mm"
                                showTime="true"
                                required="true"
                                requiredMessage="#{msg['mensajes.error']}" />
                        </div>

                        <div class="form-field">
                            <p:outputLabel
                                for="indicaciones"
                                value="#{msg['ordenExamen.indicaciones']}"
                                styleClass="form-label" />

                            <p:inputTextarea
                                id="indicaciones"
                                value="#{ordenExamenModel.seleccionado.indicaciones}"
                                rows="4"
                                placeholder="#{msg['ordenExamen.indicacionesPlaceholder']}"
                                autoResize="false" />
                        </div>
                    </div>

                    <div class="dialog-actions">
                        <crud:botones-bottom
                            model="#{ordenExamenModel}"
                            procesar="@this edicionContenido"
                            actualizar="messages ordenExamenTable edicionDialog"
                            oncompleteCancelar="PF('ordenExamenDialog').hide()"
                            oncompleteGuardar="if (!args.validationFailed) PF('ordenExamenDialog').hide()" />
                    </div>
                </h:panelGroup>
            </p:outputPanel>
        </p:dialog>
    </ui:define>
</ui:composition>
