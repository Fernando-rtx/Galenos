<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:crud="jakarta.faces.composite/crud"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="primefaces"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/plantillas/general.xhtml">
    <f:metadata>
        <f:viewParam name="idPersona"
                     value="#{personaModel.idPersonaContexto}" />
    </f:metadata>
    <ui:define name="titulo">#{msg['persona.titulo']} | #{msg['app.nombre']}</ui:define>
    <ui:define name="head">
        <h:outputStylesheet library="estilos" name="persona.css" />
    </ui:define>
    <ui:define name="contenido">
        <!-- Encabezado y navegación contextual -->
        <main class="page-shell">
            <section class="clinical-card">
                <div class="clinical-topbar"></div>
                <div class="card-content">
                    <div class="page-header">
                        <div>
                            <h1 class="page-title">#{msg['persona.titulo']}</h1>
                            <p class="page-subtitle">#{msg['persona.subtitulo']}</p>
                        </div>
                        <div>
                            <div class="crud-actions-top">
                                <p:commandButton value="#{msg['crud.nuevo']}"
                                                 icon="pi pi-plus"
                                                 action="#{personaModel.nuevaPersona(documentoModel, medioContactoModel, personaRolModel)}"
                                                 process="@this"
                                                 update=":layoutForm:messages :layoutForm:personaTable :layoutForm:edicionDialog"
                                                 resetValues="true"
                                                 oncomplete="PF('personaDialog').show()"
                                                 styleClass="clinical-primary" />
                            </div>
                        </div>
                    </div>
                    <div class="section-divider"></div>
                    <p:messages id="messages"
                                globalOnly="true"
                                redisplay="false"
                                showDetail="false"
                                closable="true" />

                    <!-- Tabla principal -->
                    <div class="table-title">#{msg['persona.lista']}</div>
                    <h:outputText value="#{msg['crud.dobleClicEditar']}"
                                  styleClass="page-subtitle" />
                    <p:dataTable id="personaTable"
                                 value="#{personaModel}"
                                 var="item"
                                 lazy="true"
                                 paginator="true"
                                 rows="10"
                                 reflow="true"
                                 selectionMode="single"
                                 selection="#{personaModel.seleccionado}"
                                 rowKey="#{personaModel.getRowKey(item)}"
                                 emptyMessage="#{msg['persona.sinRegistros']}"
                                 styleClass="clinical-table persona-table">
                        <p:ajax event="rowDblselect"
                                listener="#{personaModel.seleccionarFila}"
                                update=":layoutForm:messages :layoutForm:edicionDialog"
                                resetValues="true"
                                oncomplete="PF('personaDialog').show()" />
                        <p:column headerText="#{msg['persona.nombres']}"
                                  field="nombres"
                                  sortBy="#{item.nombres}"
                                  filterBy="#{item.nombres}"
                                  filterMatchMode="contains">
                            <h:outputText value="#{item.nombres}"
                                          styleClass="nombre-persona" />
                        </p:column>
                        <p:column headerText="#{msg['persona.apellidos']}"
                                  field="apellidos"
                                  sortBy="#{item.apellidos}"
                                  filterBy="#{item.apellidos}"
                                  filterMatchMode="contains">
                            <h:outputText value="#{item.apellidos}" />
                        </p:column>
                        <p:column headerText="#{msg['persona.fechaNacimiento']}"
                                  field="fechaNacimiento"
                                  sortBy="#{item.fechaNacimiento}">
                            <h:outputText value="#{item.fechaNacimiento}">
                                <f:convertDateTime pattern="dd/MM/yyyy" />
                            </h:outputText>
                        </p:column>
                    </p:dataTable>
                </div>
            </section>
        </main>

        <!-- Un único diálogo: las dependencias se editan inline por persona. -->
        <p:dialog id="edicionDialog"
                  widgetVar="personaDialog"
                  header="#{personaModel.estado eq 'CREACION' ? msg['persona.nueva'] : msg['persona.editar']}"
                  modal="true"
                  responsive="true"
                  resizable="false"
                  width="900"
                  styleClass="clinical-dialog">
                    <p:ajax event="close"
                    listener="#{personaModel.cerrarEdicion(documentoModel, medioContactoModel, personaRolModel)}"
                    process="@this"
                    update="edicionDialog"
                    resetValues="true" />
            <p:outputPanel id="edicionContenido">
                <h:panelGroup rendered="#{personaModel.seleccionado ne null}">
                    <p:tabView id="personaTabs">
                        <p:ajax event="tabChange"
                                process="@this"
                                update=":layoutForm:messages :layoutForm:personaTabs:documentosMessages :layoutForm:personaTabs:contactosMessages :layoutForm:personaTabs:rolesMessages" />
                        <p:tab title="#{msg['persona.detalle']}">
                            <p:outputPanel id="detallePersona"
                                           layout="block"
                                           styleClass="dialog-form">
                                <div class="form-field">
                                    <p:outputLabel for="nombres"
                                                   value="#{msg['persona.nombres']} *" />
                                    <p:inputText id="nombres"
                                                 value="#{personaModel.seleccionado.nombres}"
                                                 maxlength="255" />
                                    <p:message for="nombres" />
                                </div>
                                <div class="form-field">
                                    <p:outputLabel for="apellidos"
                                                   value="#{msg['persona.apellidos']} *" />
                                    <p:inputText id="apellidos"
                                                 value="#{personaModel.seleccionado.apellidos}"
                                                 maxlength="255" />
                                    <p:message for="apellidos" />
                                </div>
                                <div class="form-field">
                                    <p:outputLabel for="fechaNacimiento"
                                                   value="#{msg['persona.fechaNacimiento']} *" />
                                    <p:datePicker id="fechaNacimiento"
                                                  value="#{personaModel.seleccionado.fechaNacimiento}"
                                                  pattern="dd/MM/yyyy"
                                                  mindate="#{personaModel.fechaMinimaNacimiento}"
                                                  maxdate="#{personaModel.fechaMaximaNacimiento}"
                                                  monthNavigator="true"
                                                  yearNavigator="select"
                                                  yearRange="#{personaModel.rangoAniosNacimiento}"
                                                  panelStyleClass="persona-birthdate-panel"
                                                  readonlyInput="true"
                                                  showOnFocus="false"
                                                  showIcon="true" />
                                    <p:message for="fechaNacimiento" />
                                </div>
                                <p:focus context="detallePersona" />
                            </p:outputPanel>
                            <div class="dialog-actions">
                                <p:commandButton value="#{msg['crud.cancelar']}"
                                                 action="#{personaModel.cerrarEdicion(documentoModel, medioContactoModel, personaRolModel)}"
                                                 process="@this"
                                                 update=":layoutForm:messages :layoutForm:personaTable :layoutForm:edicionDialog"
                                                 immediate="true"
                                                 resetValues="true"
                                                 oncomplete="PF('personaDialog').hide()" />
                                <p:commandButton value="#{msg['crud.guardar']}"
                                                 action="#{personaModel.guardar()}"
                                                 process="@this detallePersona"
                                                 update=":layoutForm:messages :layoutForm:personaTable :layoutForm:edicionContenido"
                                                 oncomplete="if (args.personaGuardada === true) PF('personaDialog').hide()" />
                            </div>
                        </p:tab>

                        <p:tab title="#{msg['persona.documentos']}"
                               disabled="#{personaModel.seleccionado.idPersona eq null}">
                            <p:outputPanel id="documentosContenido">
                                <p:messages id="documentosMessages"
                                            globalOnly="true"
                                            redisplay="false"
                                            showDetail="false"
                                            closable="true" />
                                <p:commandButton value="#{msg['documento.nuevo']}"
                                                 icon="pi pi-plus"
                                                 action="#{documentoModel.nuevoParaPersona(personaModel.seleccionado)}"
                                                 process="@this"
                                                 update="documentosContenido" />
                                <p:dataTable id="documentosTable"
                                             value="#{documentoModel.getDocumentosPorPersona(personaModel.seleccionado)}"
                                             var="documento"
                                             selectionMode="single"
                                             selection="#{documentoModel.seleccionado}"
                                             rowKey="#{documento.idDocumento}"
                                             emptyMessage="#{msg['documento.sinRegistros']}"
                                             styleClass="clinical-table">
                                    <p:ajax event="rowDblselect"
                                            listener="#{documentoModel.seleccionarParaPersona(documentoModel.seleccionado, personaModel.seleccionado)}"
                                            process="@this"
                                            update="documentosContenido"
                                            resetValues="true" />
                                    <p:column headerText="#{msg['documento.tipo']}">
                                        <h:outputText value="#{documento.idTipoDocumento.nombre}" />
                                    </p:column>
                                    <p:column headerText="#{msg['documento.valor']}">
                                        <h:outputText value="#{documento.valor}" />
                                    </p:column>
                                    <p:column headerText="#{msg['documento.rutaFisica']}">
                                        <h:outputText value="#{empty documento.rutaFisica ? msg['comun.sinDato'] : documento.rutaFisica}" />
                                    </p:column>
                                </p:dataTable>

                                <h:panelGroup rendered="#{documentoModel.isSeleccionadoParaPersona(personaModel.seleccionado)}">
                                    <p:outputPanel id="documentoForm"
                                                   layout="block"
                                                   styleClass="dialog-form">
                                        <div class="form-field">
                                            <p:outputLabel for="tipo" value="#{msg['documento.tipo']}" />
                                            <p:selectOneMenu id="tipo"
                                                 value="#{documentoModel.tipoDocumentoSeleccionadoId}"
                                                 required="true"
                                                 disabled="#{documentoModel.estado eq 'EDICION'}"
                                                 requiredMessage="#{msg['documento.tipoRequerido']}">
                                                <f:selectItem itemLabel="#{msg['selector.seleccione']}"
                                                              itemValue="#{null}"
                                                              noSelectionOption="true" />
                                                <f:selectItems value="#{documentoModel.tiposDocumento}"
                                                               var="tipo"
                                                               itemValue="#{tipo.idTipoDocumento}"
                                                               itemLabel="#{tipo.nombre}" />
                                            </p:selectOneMenu>
                                            <p:message for="tipo" />
                                        </div>
                                        <div class="form-field">
                                            <p:outputLabel for="valor" value="#{msg['documento.valor']}" />
                                            <p:inputText id="valor"
                                                         value="#{documentoModel.seleccionado.valor}"
                                                         required="true"
                                                         requiredMessage="#{msg['documento.valorRequerido']}" />
                                            <p:message for="valor" />
                                        </div>
                                        <div class="form-field">
                                            <p:outputLabel for="documentoRuta" value="#{msg['documento.rutaFisica']}" />
                                            <p:inputText id="documentoRuta"
                                                         value="#{documentoModel.seleccionado.rutaFisica}" />
                                        </div>
                                    </p:outputPanel>
                                    <div class="dialog-actions">
                                        <p:commandButton value="#{msg['crud.eliminar']}"
                                                         icon="pi pi-trash"
                                                         styleClass="ui-button-danger"
                                                         rendered="#{documentoModel.estado eq 'EDICION'}"
                                                         action="#{documentoModel.eliminarSeleccionadoParaPersona(personaModel.seleccionado)}"
                                                         process="@this"
                                                         update="documentosContenido"
                                                         immediate="true"
                                                         resetValues="true">
                                            <p:confirm header="#{msg['crud.confirmar']}"
                                                       message="#{msg['documento.confirmarEliminar']}"
                                                       icon="pi pi-exclamation-triangle" />
                                        </p:commandButton>
                                        <p:commandButton value="#{msg['crud.cancelar']}"
                                                         action="#{documentoModel.cancelar()}"
                                                         process="@this"
                                                         update="documentosContenido"
                                                         immediate="true"
                                                         resetValues="true" />
                                <p:commandButton value="#{msg['crud.guardar']}"
                                                 action="#{documentoModel.guardar()}"
                                                 process="documentoForm"
                                                 update="documentosContenido" />
                                    </div>
                                </h:panelGroup>
                            </p:outputPanel>
                        </p:tab>

                        <p:tab title="#{msg['persona.contactos']}"
                               disabled="#{personaModel.seleccionado.idPersona eq null}">
                            <p:outputPanel id="contactosContenido">
                                <p:messages id="contactosMessages"
                                            globalOnly="true"
                                            redisplay="false"
                                            showDetail="false"
                                            closable="true" />
                                <p:commandButton value="#{msg['medioContacto.nuevo']}"
                                                 icon="pi pi-plus"
                                                 action="#{medioContactoModel.nuevoParaPersona(personaModel.seleccionado)}"
                                                 process="@this"
                                                 update="contactosContenido" />
                                <p:dataTable id="contactosTable"
                                             value="#{medioContactoModel.getContactosPorPersona(personaModel.seleccionado)}"
                                             var="contacto"
                                             selectionMode="single"
                                             selection="#{medioContactoModel.seleccionado}"
                                             rowKey="#{contacto.idMedioContacto}"
                                             emptyMessage="#{msg['medioContacto.sinRegistros']}"
                                             styleClass="clinical-table">
                                    <p:ajax event="rowDblselect"
                                            listener="#{medioContactoModel.seleccionarFilaParaPersona}"
                                            process="@this"
                                            update="contactosContenido"
                                            resetValues="true" />
                                    <p:column headerText="#{msg['medioContacto.tipo']}">
                                        <h:outputText value="#{contacto.idTipoMedioContacto.nombre}" />
                                    </p:column>
                                    <p:column headerText="#{msg['medioContacto.valor']}">
                                        <h:outputText value="#{contacto.valor}" />
                                    </p:column>
                                </p:dataTable>

                                <h:panelGroup rendered="#{medioContactoModel.isSeleccionadoParaPersona(personaModel.seleccionado)}">
                                    <p:outputPanel id="contactoForm"
                                                   layout="block"
                                                   styleClass="dialog-form">
                                        <div class="form-field">
                                            <p:outputLabel for="contactoTipo" value="#{msg['medioContacto.tipo']}" />
                                            <p:selectOneMenu id="contactoTipo"
                                                             value="#{medioContactoModel.tipoMedioSeleccionadoId}"
                                                             required="true"
                                                             disabled="#{medioContactoModel.estado eq 'EDICION'}"
                                                             requiredMessage="#{msg['medioContacto.tipoRequerido']}">
                                                <f:selectItem itemLabel="#{msg['selector.seleccione']}"
                                                              itemValue="#{null}"
                                                              noSelectionOption="true" />
                                                <f:selectItems value="#{medioContactoModel.tiposMedioContactoAsignables}"
                                                               var="tipo"
                                                               itemValue="#{tipo.idTipoMedioContacto}"
                                                               itemLabel="#{tipo.activo eq true ? tipo.nombre : tipo.nombre.concat(' (').concat(msg['tipoMedioContacto.inactivo']).concat(')')}" />
                                            </p:selectOneMenu>
                                            <p:message for="contactoTipo" />
                                        </div>
                                        <div class="form-field">
                                            <p:outputLabel for="contactoValor" value="#{msg['medioContacto.valor']}" />
                                            <p:inputText id="contactoValor"
                                                         value="#{medioContactoModel.seleccionado.valor}"
                                                         required="true"
                                                         requiredMessage="#{msg['medioContacto.valorRequerido']}" />
                                            <p:message for="contactoValor" />
                                        </div>
                                    </p:outputPanel>
                                    <div class="dialog-actions">
                                        <p:commandButton value="#{msg['crud.eliminar']}"
                                                         icon="pi pi-trash"
                                                         styleClass="ui-button-danger"
                                                         rendered="#{medioContactoModel.estado eq 'EDICION'}"
                                                         action="#{medioContactoModel.eliminarSeleccionadoParaPersona(personaModel.seleccionado)}"
                                                         process="@this"
                                                         update="contactosContenido"
                                                         immediate="true"
                                                         resetValues="true">
                                            <p:confirm header="#{msg['crud.confirmar']}"
                                                       message="#{msg['medioContacto.confirmarEliminar']}"
                                                       icon="pi pi-exclamation-triangle" />
                                        </p:commandButton>
                                        <p:commandButton value="#{msg['crud.cancelar']}"
                                                         action="#{medioContactoModel.cancelar()}"
                                                         process="@this"
                                                         update="contactosContenido"
                                                         immediate="true"
                                                         resetValues="true" />
                                <p:commandButton value="#{msg['crud.guardar']}"
                                                         action="#{medioContactoModel.guardar()}"
                                                         process="contactoForm"
                                                         update="contactosContenido" />
                                    </div>
                                </h:panelGroup>
                            </p:outputPanel>
                        </p:tab>

                        <p:tab title="#{msg['persona.roles']}"
                               disabled="#{personaModel.seleccionado.idPersona eq null}">
                            <p:outputPanel id="rolesContenido">
                                <p:messages id="rolesMessages"
                                            globalOnly="true"
                                            redisplay="false"
                                            showDetail="false"
                                            closable="true" />
                                <p:commandButton value="#{msg['personaRol.nuevo']}"
                                                 icon="pi pi-plus"
                                                 action="#{personaRolModel.nuevoParaPersona(personaModel.seleccionado)}"
                                                 process="@this"
                                                 update="rolesContenido" />
                                <p:dataTable id="rolesTable"
                                             value="#{personaRolModel.getRolesPorPersona(personaModel.seleccionado)}"
                                             var="personaRol"
                                             selectionMode="single"
                                             selection="#{personaRolModel.seleccionado}"
                                             rowKey="#{personaRol.idPersonaRol}"
                                             emptyMessage="#{msg['personaRol.sinRegistros']}"
                                             styleClass="clinical-table">
                                    <p:ajax event="rowDblselect"
                                            listener="#{personaRolModel.seleccionarFilaParaPersona}"
                                            process="@this"
                                            update="rolesContenido"
                                            resetValues="true" />
                                    <p:column headerText="#{msg['personaRol.rol']}">
                                        <h:outputText value="#{personaRol.idRol.nombre}" />
                                    </p:column>
                                    <p:column headerText="#{msg['personaRol.clinica']}">
                                        <h:outputText value="#{personaRol.idClinica.nombre}" />
                                    </p:column>
                                    <p:column headerText="#{msg['personaRol.fechaCreacion']}">
                                        <h:outputText value="#{personaRol.fechaCreacion}">
                                            <f:convertDateTime pattern="dd/MM/yyyy" />
                                        </h:outputText>
                                    </p:column>
                                </p:dataTable>

                                <h:panelGroup rendered="#{personaRolModel.isSeleccionadoParaPersona(personaModel.seleccionado)}">
                                    <p:outputPanel id="rolForm"
                                                   layout="block"
                                                   styleClass="dialog-form">
                                        <div class="form-field">
                                            <p:outputLabel for="rolSeleccionado" value="#{msg['personaRol.rol']}" />
                                            <p:selectOneMenu id="rolSeleccionado"
                                                             value="#{personaRolModel.rolSeleccionadoId}"
                                                             required="true"
                                                             disabled="#{personaRolModel.estado eq 'EDICION'}"
                                                             requiredMessage="#{msg['personaRol.rolRequerido']}">
                                                <f:selectItem itemLabel="#{msg['selector.seleccione']}"
                                                              itemValue="#{null}"
                                                              noSelectionOption="true" />
                                                <f:selectItems value="#{personaRolModel.roles}"
                                                               var="rol"
                                                               itemValue="#{rol.idRol}"
                                                               itemLabel="#{rol.nombre}" />
                                            </p:selectOneMenu>
                                            <p:message for="rolSeleccionado" />
                                        </div>
                                        <div class="form-field">
                                            <p:outputLabel for="clinicaSeleccionada" value="#{msg['personaRol.clinica']}" />
                                            <p:selectOneMenu id="clinicaSeleccionada"
                                                             value="#{personaRolModel.clinicaSeleccionadaId}"
                                                             required="true"
                                                             disabled="#{personaRolModel.estado eq 'EDICION'}"
                                                             requiredMessage="#{msg['personaRol.clinicaRequerida']}">
                                                <f:selectItem itemLabel="#{msg['selector.seleccione']}"
                                                              itemValue="#{null}"
                                                              noSelectionOption="true" />
                                                <f:selectItems value="#{personaRolModel.clinicasDisponibles}"
                                                               var="clinica"
                                                               itemValue="#{clinica.idClinica}"
                                                               itemLabel="#{clinica.activo eq true
                                                                            ? clinica.nombre
                                                                            : clinica.nombre.concat(' (').concat(msg['clinica.inactivo']).concat(')')}" />
                                            </p:selectOneMenu>
                                            <p:message for="clinicaSeleccionada" />
                                        </div>
                                    </p:outputPanel>
                                    <div class="dialog-actions">
                                        <p:commandButton value="#{msg['crud.eliminar']}"
                                                         icon="pi pi-trash"
                                                         styleClass="ui-button-danger"
                                                         rendered="#{personaRolModel.estado eq 'EDICION'}"
                                                         action="#{personaRolModel.eliminarSeleccionadoParaPersona(personaModel.seleccionado)}"
                                                         process="@this"
                                                         update="rolesContenido"
                                                         immediate="true"
                                                         resetValues="true">
                                            <p:confirm header="#{msg['crud.confirmar']}"
                                                       message="#{msg['personaRol.confirmarEliminar']}"
                                                       icon="pi pi-exclamation-triangle" />
                                        </p:commandButton>
                                        <p:commandButton value="#{msg['crud.cancelar']}"
                                                         action="#{personaRolModel.cancelar()}"
                                                         process="@this"
                                                         update="rolesContenido"
                                                         immediate="true"
                                                         resetValues="true" />
                                        <p:commandButton value="#{msg['crud.guardar']}"
                                                         action="#{personaRolModel.guardar()}"
                                                         process="rolForm"
                                                         update="rolesContenido" />
                                    </div>
                                </h:panelGroup>
                            </p:outputPanel>
                        </p:tab>
                    </p:tabView>
                </h:panelGroup>
            </p:outputPanel>
            <p:confirmDialog global="true" responsive="true">
                <p:commandButton value="#{msg['crud.no']}"
                                 type="button"
                                 styleClass="ui-confirmdialog-no ui-button-flat" />
                <p:commandButton value="#{msg['crud.si']}"
                                 type="button"
                                 styleClass="ui-confirmdialog-yes ui-button-danger" />
            </p:confirmDialog>
        </p:dialog>
    </ui:define>
</ui:composition>
