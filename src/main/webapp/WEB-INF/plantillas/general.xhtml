<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces"
      xmlns:ui="jakarta.faces.facelets"
      lang="#{idiomaBean.locale.toLanguageTag()}">

    <f:view locale="#{idiomaBean.locale}">
    <h:head>
        <title>
            <ui:insert name="titulo">#{msg['app.nombre']}</ui:insert>
        </title>
        <h:outputStylesheet library="estilos" name="galenos.css" />
        <ui:insert name="head" />
    </h:head>

    <h:body styleClass="clinical-body">
        <h:form id="layoutForm">
            <div class="layout-shell">

                <header class="layout-header ui-g">
                    <div class="ui-g-12 ui-md-4 layout-logo">
                        <h:graphicImage library="imagenes"
                                        name="galenos-sv-logo.png"
                                        alt="Galenos SV — Clínica General"
                                        width="2048" height="768"
                                        styleClass="layout-logo-image" />
                    </div>

                    <div class="ui-g-12 ui-md-4 layout-brand">
                        #{msg['app.nombre']}
                    </div>

                    <div class="ui-g-12 ui-md-4 layout-tools">
                        <p:outputLabel
                            for="idioma"
                            value="#{msg['idioma.seleccionar']}" />

                        <p:selectOneMenu
                            id="idioma"
                            value="#{idiomaBean.idioma}"
                            styleClass="layout-language">

                            <f:selectItem
                                itemLabel="#{msg['idioma.espanol']}"
                                itemValue="es" />
                            <f:selectItem
                                itemLabel="#{msg['idioma.ingles']}"
                                itemValue="en" />
                            <f:selectItem
                                itemLabel="#{msg['idioma.aleman']}"
                                itemValue="de" />
                            <f:selectItem itemLabel="中文" 
                                          itemValue="zh_CN"/>
                            <p:ajax
                                event="change"
                                listener="#{idiomaBean.cambiarIdioma}"
                                process="@this"
                                update="@all" />
                        </p:selectOneMenu>
                    </div>
                </header>

                <main class="layout-body ui-g">
                    <aside class="ui-g-12 ui-md-2 layout-nav">
                        <div class="layout-nav-inner">
                            <span class="layout-nav-title">
                                #{msg['app.navegacion']}
                            </span>

                            <h:link
                                outcome="/paginas/Persona"
                                value="#{msg['nav.persona']}"
                                styleClass="layout-nav-link" />

                            <h:link
                                outcome="/paginas/Consulta"
                                value="#{msg['nav.consulta']}"
                                styleClass="layout-nav-link" />

                            <h:link
                                outcome="/paginas/Examen"
                                value="#{msg['nav.examen']}"
                                styleClass="layout-nav-link" />

                            <h:link
                                outcome="/paginas/Procedimiento"
                                value="#{msg['nav.procedimiento']}"
                                styleClass="layout-nav-link" />

                            <span class="layout-nav-title">
                                #{msg['nav.catalogos']}
                            </span>

                            <h:link
                                outcome="/paginas/Clinica"
                                value="#{msg['nav.clinica']}"
                                styleClass="layout-nav-link" />

                            <h:link
                                outcome="/paginas/Rol"
                                value="#{msg['nav.rol']}"
                                styleClass="layout-nav-link" />

                            <h:link
                                outcome="/paginas/TipoDocumento"
                                value="#{msg['nav.tipoDocumento']}"
                                styleClass="layout-nav-link" />

                            <h:link
                                outcome="/paginas/TipoMedioContacto"
                                value="#{msg['nav.tipoMedioContacto']}"
                                styleClass="layout-nav-link" />

                            <h:link
                                outcome="/paginas/TipoExamen"
                                value="#{msg['nav.tipoExamen']}"
                                styleClass="layout-nav-link" />
                        </div>
                    </aside>

                    <section class="ui-g-12 ui-md-10 layout-workspace">
                        <ui:insert name="contenido" />
                    </section>
                </main>

                <footer class="layout-footer ui-g">
                    <div class="ui-g-12">
                        #{msg['app.footer']}
                    </div>
                </footer>
            </div>
        </h:form>
    </h:body>
    </f:view>
</html>
